<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UpAbdo</title>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#080c14"/>
<link rel="apple-touch-icon" href="/icon.png"/>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c14;
  --card:#0f1520;
  --border:#1a2235;
  --accent:#00d4ff;
  --accent2:#ff6b35;
  --green:#00ff88;
  --text:#e2e8f0;
  --muted:#4a5568;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Tajawal',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow-x:hidden;
}
/* animated bg */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 20%, rgba(0,212,255,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 80%, rgba(255,107,53,0.05) 0%, transparent 60%);
  pointer-events:none;
  z-index:0;
}
body::after{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(0,212,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.02) 1px, transparent 1px);
  background-size:32px 32px;
  pointer-events:none;
  z-index:0;
}
.wrap{
  position:relative;
  z-index:1;
  width:100%;
  max-width:520px;
}
/* header */
.logo{
  text-align:center;
  margin-bottom:36px;
  animation:fadeUp .5s ease both;
}
.logo-tag{
  display:inline-block;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--accent);
  letter-spacing:4px;
  border:1px solid rgba(0,212,255,0.25);
  padding:4px 14px;
  border-radius:99px;
  margin-bottom:14px;
}
.logo h1{
  font-size:48px;
  font-weight:900;
  line-height:1;
  background:linear-gradient(135deg,#fff 0%,var(--accent) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.logo p{
  margin-top:8px;
  font-size:15px;
  color:var(--muted);
  font-weight:300;
}
/* card */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px;
  animation:fadeUp .5s .1s ease both;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:.4;
}
/* drop zone */
.drop{
  border:2px dashed var(--border);
  border-radius:14px;
  padding:44px 20px;
  text-align:center;
  cursor:pointer;
  position:relative;
  transition:all .25s;
  background:rgba(0,0,0,.2);
}
.drop:hover,.drop.over{
  border-color:var(--accent);
  background:rgba(0,212,255,.04);
}
.drop.over{box-shadow:0 0 40px rgba(0,212,255,.12);}
#fileInput{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.drop-icon{font-size:48px;display:block;margin-bottom:12px;animation:float 3s ease-in-out infinite;}
.drop-title{font-size:18px;font-weight:700;margin-bottom:6px;}
.drop-sub{font-size:13px;color:var(--muted);}
.drop-sub b{color:var(--accent);}
/* preview */
.preview{
  display:none;
  align-items:center;
  gap:12px;
  background:rgba(0,212,255,.05);
  border:1px solid rgba(0,212,255,.15);
  border-radius:12px;
  padding:12px 16px;
  margin-top:14px;
}
.preview.show{display:flex;}
.p-icon{
  width:42px;height:42px;
  background:rgba(0,212,255,.1);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.p-info{flex:1;overflow:hidden;}
.p-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-size{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:2px;}
.p-remove{
  background:none;border:none;color:var(--muted);
  cursor:pointer;font-size:16px;padding:6px;border-radius:8px;
  transition:all .2s;flex-shrink:0;
}
.p-remove:hover{color:var(--accent2);background:rgba(255,107,53,.1);}
/* btn */
.btn{
  margin-top:16px;
  width:100%;
  padding:15px;
  background:linear-gradient(135deg,var(--accent),#0099cc);
  border:none;border-radius:12px;
  color:#000;font-size:16px;font-weight:900;
  font-family:'Tajawal',sans-serif;
  cursor:pointer;
  transition:all .25s;
  position:relative;overflow:hidden;
}
.btn:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(0,212,255,.3);
}
.btn:disabled{opacity:.4;cursor:not-allowed;}
/* progress */
.prog{display:none;margin-top:14px;}
.prog.show{display:block;}
.prog-top{
  display:flex;justify-content:space-between;
  font-size:12px;color:var(--muted);margin-bottom:6px;
  font-family:'JetBrains Mono',monospace;
}
.prog-bar{height:5px;background:var(--border);border-radius:99px;overflow:hidden;}
.prog-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent),#00ff88);
  border-radius:99px;width:0%;transition:width .2s;
}
/* error */
.err{
  display:none;margin-top:12px;
  background:rgba(255,107,53,.08);
  border:1px solid rgba(255,107,53,.2);
  border-radius:10px;padding:11px 14px;
  font-size:13px;color:var(--accent2);
}
.err.show{display:block;}
/* result */
.result{
  display:none;margin-top:18px;
  background:rgba(0,255,136,.06);
  border:1px solid rgba(0,255,136,.2);
  border-radius:14px;padding:18px;
  animation:slideIn .35s ease;
}
.result.show{display:block;}
.result-title{
  display:flex;align-items:center;gap:8px;
  font-size:14px;font-weight:700;color:var(--green);margin-bottom:12px;
}
.link-row{display:flex;gap:8px;}
.link-input{
  flex:1;background:rgba(0,0,0,.3);
  border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;color:var(--text);
  font-size:12px;font-family:'JetBrains Mono',monospace;
  outline:none;direction:ltr;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.copy-btn{
  background:rgba(0,0,0,.3);
  border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;color:var(--text);
  cursor:pointer;font-size:16px;
  transition:all .2s;flex-shrink:0;
}
.copy-btn:hover{border-color:var(--accent);color:var(--accent);}
.copy-btn.ok{border-color:var(--green);color:var(--green);}
.dl-link{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:10px;padding:11px;
  background:rgba(0,255,136,.08);
  border:1px solid rgba(0,255,136,.2);
  border-radius:10px;color:var(--green);
  text-decoration:none;font-size:14px;font-weight:700;
  transition:all .2s;
}
.dl-link:hover{background:rgba(0,255,136,.14);transform:translateY(-1px);}
.del-link{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:8px;padding:11px;width:100%;
  background:rgba(255,101,132,.08);
  border:1px solid rgba(255,101,132,.25);
  border-radius:10px;color:#ff6584;
  cursor:pointer;font-size:14px;font-weight:700;
  font-family:'Tajawal',sans-serif;
  transition:all .2s;
}
.del-link:hover{background:rgba(255,101,132,.2);}
/* history */
.history{
  margin-top:24px;
  animation:fadeUp .5s .2s ease both;
}
.history-label{
  font-size:11px;color:var(--muted);
  letter-spacing:2px;font-family:'JetBrains Mono',monospace;
  margin-bottom:10px;
}
.h-list{display:flex;flex-direction:column;gap:7px;max-height:180px;overflow-y:auto;}
.h-item{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:9px 13px;font-size:13px;
  animation:slideIn .3s ease;
}
.h-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.h-link{color:var(--accent);text-decoration:none;font-size:12px;font-family:'JetBrains Mono',monospace;white-space:nowrap;}
.h-link:hover{text-decoration:underline;}
/* stats */
.stats{
  display:flex;justify-content:center;gap:40px;
  margin-top:28px;
  animation:fadeUp .5s .3s ease both;
}
.stat{text-align:center;}
.stat-n{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600;color:var(--accent);}
.stat-l{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
/* scrollbar */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}
/* animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.spin{
  display:inline-block;width:14px;height:14px;
  border:2px solid rgba(0,0,0,.3);border-top-color:#000;
  border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:6px;
}
@keyframes sp{to{transform:rotate(360deg)}}
/* myfiles */
.myfiles-section{margin-top:24px;animation:fadeUp .5s .2s ease both;}
.myfiles-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.myfiles-title{font-size:14px;font-weight:700;color:var(--accent);}
.clear-btn{background:none;border:1px solid rgba(255,101,132,.3);border-radius:8px;color:#ff6584;font-size:12px;padding:4px 10px;cursor:pointer;font-family:'Tajawal',sans-serif;}
.clear-btn:hover{background:rgba(255,101,132,.1);}
.myfiles-list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;}
.empty-msg{text-align:center;color:var(--muted);font-size:13px;padding:20px;}
.mf-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;animation:slideIn .3s ease;}
.mf-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;}
.mf-actions{display:flex;gap:8px;}
.mf-copy{flex:1;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);border-radius:8px;color:var(--accent);font-size:12px;padding:6px;cursor:pointer;font-family:'Tajawal',sans-serif;}
.mf-copy:hover{background:rgba(0,212,255,.15);}
.mf-dl{flex:1;background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.2);border-radius:8px;color:var(--green);font-size:12px;padding:6px;text-decoration:none;text-align:center;display:flex;align-items:center;justify-content:center;}
.mf-dl:hover{background:rgba(0,255,136,.15);}
.mf-del{background:rgba(255,101,132,.08);border:1px solid rgba(255,101,132,.2);border-radius:8px;color:#ff6584;font-size:12px;padding:6px 10px;cursor:pointer;font-family:'Tajawal',sans-serif;}
.mf-del:hover{background:rgba(255,101,132,.15);}
</style>
</head>
<body>
<div class="wrap">

  <div class="logo">
    <div class="logo-tag">FILE SHARE</div>
    <h1>UpAbdo</h1>
    <p>ارفع أي ملف واحصل على رابط تحميل مباشر فوري</p>
  </div>

  <div class="card">
    <div class="drop" id="drop">
      <input type="file" id="fileInput"/>
      <span class="drop-icon">📦</span>
      <div class="drop-title">اسحب الملف هنا أو انقر للاختيار</div>
      <div class="drop-sub">أي نوع · حتى <b>20 MB</b></div>
    </div>

    <div class="preview" id="preview">
      <div class="p-icon" id="pIcon">📄</div>
      <div class="p-info">
        <div class="p-name" id="pName"></div>
        <div class="p-size" id="pSize"></div>
      </div>
      <button class="p-remove" id="removeBtn">✕</button>
    </div>

    <button class="btn" id="uploadBtn" disabled>ارفع الملف</button>

    <div class="prog" id="prog">
      <div class="prog-top"><span>جاري الرفع...</span><span id="progPct">0%</span></div>
      <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
    </div>

    <div class="err" id="err"></div>

    <div class="result" id="result">
      <div class="result-title">✅ تم الرفع بنجاح!</div>
      <div class="link-row">
        <input class="link-input" id="linkInput" readonly/>
        <button class="copy-btn" id="copyBtn">📋</button>
      </div>
      <a class="dl-link" id="dlBtn" href="#" target="_blank">⬇️ تحميل مباشر</a>
      <button class="del-link" id="delBtn">🗑️ حذف الملف</button>
    </div>
  </div>

  <div class="myfiles-section" id="myfilesSection">
    <div class="myfiles-header">
      <div class="myfiles-title">📁 ملفاتي</div>
      <button class="clear-btn" id="clearAllBtn">🗑️ حذف الكل</button>
    </div>
    <div class="myfiles-list" id="myfilesList">
      <div class="empty-msg">لا توجد ملفات مرفوعة بعد</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-n" id="sCount">0</div><div class="stat-l">ملف مرفوع</div></div>
    <div class="stat"><div class="stat-n" id="sSize">0 MB</div><div class="stat-l">اجمالي البيانات</div></div>
  </div>

</div>
<script>
const SERVER = '';
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const pIcon = document.getElementById('pIcon');
const pName = document.getElementById('pName');
const pSize = document.getElementById('pSize');
const removeBtn = document.getElementById('removeBtn');
const uploadBtn = document.getElementById('uploadBtn');
const prog = document.getElementById('prog');
const progFill = document.getElementById('progFill');
const progPct = document.getElementById('progPct');
const errEl = document.getElementById('err');
const result = document.getElementById('result');
const linkInput = document.getElementById('linkInput');
const copyBtn = document.getElementById('copyBtn');
const dlBtn = document.getElementById('dlBtn');
const delBtn = document.getElementById('delBtn');
let currentDeleteUrl = '';
const historyWrap = document.getElementById('historyWrap');
const hList = document.getElementById('hList');
const sCount = document.getElementById('sCount');
const sSize = document.getElementById('sSize');

let file = null, count = 0, totalBytes = 0;

const icons = {
  jpg:'🖼',jpeg:'🖼',png:'🖼',gif:'🖼',webp:'🖼',svg:'🖼',
  mp4:'🎬',mkv:'🎬',avi:'🎬',mov:'🎬',
  mp3:'🎵',wav:'🎵',flac:'🎵',
  pdf:'📕',doc:'📝',docx:'📝',xls:'📊',xlsx:'📊',
  zip:'📦',rar:'📦','7z':'📦',
  py:'🐍',js:'🟨',html:'🌐',css:'🎨',json:'⚙️',
  txt:'📄',
};

function icon(name){
  const ext = name.split('.').pop().toLowerCase();
  return icons[ext] || '📄';
}

function fmt(b){
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(1)+' KB';
  if(b<1073741824) return (b/1048576).toFixed(1)+' MB';
  return (b/1073741824).toFixed(2)+' GB';
}

drop.addEventListener('dragover', e=>{e.preventDefault();drop.classList.add('over');});
drop.addEventListener('dragleave', ()=>drop.classList.remove('over'));
drop.addEventListener('drop', e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);});
fileInput.addEventListener('change', ()=>{ if(fileInput.files[0]) setFile(fileInput.files[0]); });

function setFile(f){
  file = f;
  pIcon.textContent = icon(f.name);
  pName.textContent = f.name;
  pSize.textContent = fmt(f.size);
  preview.classList.add('show');
  uploadBtn.disabled = false;
  result.classList.remove('show');
  errEl.classList.remove('show');
}

removeBtn.addEventListener('click', ()=>{
  file = null; fileInput.value='';
  preview.classList.remove('show');
  uploadBtn.disabled = true;
  result.classList.remove('show');
});

uploadBtn.addEventListener('click', upload);

function upload(){
  if(!file) return;
  uploadBtn.disabled = true;
  uploadBtn.innerHTML = '<span class="spin"></span>جاري الرفع...';
  prog.classList.add('show');
  errEl.classList.remove('show');
  result.classList.remove('show');

  const fd = new FormData();
  fd.append('file', file);
  const xhr = new XMLHttpRequest();

  xhr.upload.onprogress = e=>{
    if(e.lengthComputable){
      const p = Math.round(e.loaded/e.total*100);
      progFill.style.width = p+'%';
      progPct.textContent = p+'%';
    }
  };

  xhr.onload = ()=>{
    prog.classList.remove('show');
    uploadBtn.innerHTML = 'ارفع الملف';
    if(xhr.status===200){
      try{
        const d = JSON.parse(xhr.responseText);
        if(d.success){
          linkInput.value = d.download_url;
          dlBtn.href = d.download_url;
          currentDeleteUrl = d.delete_url || '';
          result.classList.add('show');
          addToMyFiles(d.original_name, d.download_url, d.delete_url || '');
          count++; totalBytes += d.size;
          sCount.textContent = count;
          sSize.textContent = fmt(totalBytes);
        } else {
          showErr(d.error || 'Upload failed');
        }
      }catch{ showErr('Server response error'); }
    } else {
      showErr('Server error: ' + xhr.status);
    }
    uploadBtn.disabled = false;
  };

  xhr.onerror = ()=>{
    prog.classList.remove('show');
    uploadBtn.innerHTML = 'ارفع الملف';
    uploadBtn.disabled = false;
    showErr('Connection failed. Make sure server.py is running on port 8081');
  };

  xhr.open('POST', `${SERVER}/upload`);
  xhr.send(fd);
}

function showErr(msg){ errEl.textContent = msg; errEl.classList.add('show'); }

copyBtn.addEventListener('click', ()=>{
  navigator.clipboard.writeText(linkInput.value).then(()=>{
    copyBtn.textContent='✅'; copyBtn.classList.add('ok');
    setTimeout(()=>{ copyBtn.textContent='📋'; copyBtn.classList.remove('ok'); }, 2000);
  });
});

delBtn.addEventListener('click', async ()=>{
  if(!currentDeleteUrl) return;
  if(!confirm('هل تريد حذف الملف نهائياً؟')) return;
  try {
    const res = await fetch(currentDeleteUrl);
    const d = await res.json();
    if(d.success){
      result.classList.remove('show');
      currentDeleteUrl = '';
      renderMyFiles();
      alert('تم حذف الملف بنجاح ✅');
    } else {
      alert('فشل الحذف: ' + (d.error || 'خطأ'));
    }
  } catch(e) {
    alert('خطأ في الاتصال');
  }
});

// My Files - localStorage
const myfilesList = document.getElementById('myfilesList');
const clearAllBtn = document.getElementById('clearAllBtn');

function getMyFiles(){
  try { return JSON.parse(localStorage.getItem('upabdo_files') || '[]'); }
  catch { return []; }
}

function saveMyFiles(files){
  localStorage.setItem('upabdo_files', JSON.stringify(files));
}

function renderMyFiles(){
  const files = getMyFiles();
  if(files.length === 0){
    myfilesList.innerHTML = '<div class="empty-msg">لا توجد ملفات مرفوعة بعد</div>';
    return;
  }
  myfilesList.innerHTML = '';
  files.forEach((f, i) => {
    const el = document.createElement('div');
    el.className = 'mf-item';
    el.innerHTML = `
      <div class="mf-name">${icon(f.name)} ${f.name}</div>
      <div class="mf-actions">
        <button class="mf-copy" data-url="${f.url}">📋 نسخ الرابط</button>
        <a class="mf-dl" href="${f.url}" target="_blank">⬇️ تحميل</a>
        <button class="mf-del" data-index="${i}" data-del="${f.deleteUrl}">🗑️</button>
      </div>
    `;
    myfilesList.appendChild(el);
  });

  // copy buttons
  myfilesList.querySelectorAll('.mf-copy').forEach(btn => {
    btn.addEventListener('click', ()=>{
      navigator.clipboard.writeText(btn.dataset.url).then(()=>{
        btn.textContent = '✅ تم النسخ';
        setTimeout(()=>{ btn.textContent = '📋 نسخ الرابط'; }, 2000);
      });
    });
  });

  // delete buttons
  myfilesList.querySelectorAll('.mf-del').forEach(btn => {
    btn.addEventListener('click', async ()=>{
      if(!confirm('حذف الملف نهائياً؟')) return;
      const delUrl = btn.dataset.del;
      const idx = parseInt(btn.dataset.index);
      try {
        if(delUrl) {
          const res = await fetch(delUrl);
          const d = await res.json();
          if(!d.success && d.error !== 'File not found'){
            alert('فشل الحذف من السيرفر');
            return;
          }
        }
      } catch(e) {}
      const files = getMyFiles();
      files.splice(idx, 1);
      saveMyFiles(files);
      renderMyFiles();
    });
  });
}

function addToMyFiles(name, url, deleteUrl){
  const files = getMyFiles();
  files.unshift({ name, url, deleteUrl, date: new Date().toISOString() });
  saveMyFiles(files);
  renderMyFiles();
}

clearAllBtn.addEventListener('click', ()=>{
  if(!confirm('حذف كل الملفات من القائمة؟')) return;
  saveMyFiles([]);
  renderMyFiles();
});

// load on start
renderMyFiles();

// PWA Service Worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}

// PWA Install prompt
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.style.marginTop='10px';
  btn.style.background='linear-gradient(135deg,#00ff88,#00cc66)';
  btn.style.color='#000';
  btn.innerHTML = '📲 ثبّت التطبيق';
  btn.onclick = ()=>{ deferredPrompt.prompt(); btn.remove(); };
  document.querySelector('.card').appendChild(btn);
});
</script>
</body>
</html>
